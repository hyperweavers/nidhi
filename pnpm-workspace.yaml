packages:
  - apps/*
  - libs/*
  - libs/shared/*
allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  cypress: true
  esbuild: true
  less: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  unrs-resolver: true
  msw: true
overrides:
  webpack-dev-server@<=5.2.3: '>=5.2.4'
  ws@>=8.0.0 <8.20.1: '>=8.20.1'
  uuid@<11.1.1: '>=11.1.1'

shamefullyHoist: false
strictPeerDependencies: false
autoInstallPeers: true
