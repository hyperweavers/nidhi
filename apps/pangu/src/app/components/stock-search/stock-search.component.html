<div class="relative">
  <div class="relative">
    <div
      class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3"
    >
      <svg
        class="h-5 w-5 text-gray-500 dark:text-gray-400"
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 20 20"
      >
        <path
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"
        />
      </svg>
    </div>
    <input
      [ngModel]="query()"
      (ngModelChange)="onInput($event)"
      (focus)="showDropdown.set(results().length > 0)"
      (blur)="onBlur()"
      (keydown.escape)="clear()"
      type="text"
      class="focus:border-primary-500 focus:ring-primary-500 dark:focus:border-primary-500 dark:focus:ring-primary-500 block w-full rounded-md border border-gray-300 bg-gray-50 p-2.5 pl-10 text-sm text-gray-900 dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:placeholder-gray-400"
      [placeholder]="placeholder()"
    />
  </div>

  @if (showDropdown() && results().length > 0) {
    <div
      class="absolute z-50 mt-1 max-h-80 w-full divide-y divide-gray-100 overflow-y-auto rounded-md bg-white shadow-sm dark:bg-gray-700"
    >
      <ul class="py-2 text-sm text-gray-700 dark:text-gray-200">
        @for (stock of results(); track stock.vendorCode.etm.primary) {
          <li
            (mousedown)="
              mode() === 'sitewide'
                ? navigateToStock(stock)
                : selectStock(stock)
            "
            class="block cursor-pointer px-4 py-3 hover:bg-gray-100 dark:hover:bg-gray-600 dark:hover:text-white"
          >
            {{ stock.name }}
          </li>
        }
      </ul>
    </div>
  }
</div>
